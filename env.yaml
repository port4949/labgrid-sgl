targets:
  main:
    resources:
      RemotePlace:
        name: beaglev-1
    drivers:
      YKUSHPowerDriver: {}
      SerialDriver: {}
      UBootDriver:
        prompt: 'RISC-V #'
      ShellDriver:
        prompt: 'root@[\w-]+:[^ ]+ '
        login_prompt: 'beaglev-fire login:'
        username: 'root'
        login_timeout: 120
        # await_lgon_timeout set to avoid nnewline in HSS -> abort boot
        await_login_timeout: 10 
      BeaglevFireStrategy: {}
imports:
  - beaglevfirestrategy.py
